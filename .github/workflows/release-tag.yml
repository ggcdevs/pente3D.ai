# Cut the version tag for a push (issue #22).
#
# GIT TAGS ARE THE SINGLE SOURCE OF TRUTH for this project's version. `package.json` stays
# at the placeholder "0.0.0" and nothing reads it; the app's `__APP_VERSION__` and the
# `version.json` deploy fingerprint both come from `git describe` at build time. This
# workflow is what MOVES that source of truth forward.
#
# CADENCE
#   push to main → release tag `vX.Y.Z` + a GitHub Release listing the commits
#   push to test → prerelease tag `vX.Y.Z-rc.N` (no Release; it is a staging marker)
#   dev / feature branches → NO TAG AT ALL. Their version is whatever `git describe`
#     says (`v3.0.0-84-gb0cf3cb`), which is already unambiguous.
#
# HOW THE BUMP IS DERIVED — two redundant signals, the HIGHER wins:
#   commit prefixes  `feat:` → minor, `fix:` → patch, docs/test/chore/style/ci/refactor/
#                    workflow/plan → no release
#   ticket labels    every `#N` a commit cites: `enhancement` → minor, `bug` → patch
# When they DISAGREE the higher wins and the pair is logged as a MISMATCH warning — that
# is the mislabel-catcher, and it deliberately does not fail the run. When `gh` cannot be
# reached the ticket half is skipped with a logged reason and the commit half still
# decides (see tools/versionBump.mjs).
#
# MAJOR IS NEVER AUTOMATIC. `tools/versionBump.mjs` cannot return "major" — no code path
# produces it. THE MAJOR IS THE WIRE-PROTOCOL VERSION (CONTRIBUTING "Versioning"): it bumps iff
# the network protocol breaks, so that "if the majors differ, no game" is one integer
# comparison. Nothing in a commit message proves the protocol broke; only a human can. A
# `feat!:` / `BREAKING CHANGE` commit raises the `manualMajor` flag, echoed loudly below.
#
# Tagging a major is therefore THE ONLY MANUAL STEP in the whole release process:
#
#   git tag -a v5.0.0 -m 'why the wire changed' && git push origin v5.0.0   # on `dev`
#
# Tag BEFORE pushing the branch, or the bump is computed from the previous tag and the
# wrong version is cut.
#
# ANY VERSION THAT REACHES `main` GETS A RELEASE (#55). Two kinds of tag arrive here: one
# this workflow computed, or one a human already placed on the commit. Both are published.
# The second used to fall through the floor — a hand-tagged commit makes the computed range
# EMPTY, so the job logged "nothing warrants a release", skipped, and no Release was ever
# created. Right version, missing Release, green check. `tools/version.mjs` now reports a
# `releaseTarget` (the computed tag if there is one, else the release tag already pointing
# at HEAD) and the Release step keys on THAT rather than on `.tag`.
#
# It refuses to guess: two release tags on one commit FAILS the job rather than picking one,
# because picking wrong publishes the wrong version under a green check.
#
# NO `npm ci` STEP ON PURPOSE: `tools/version.mjs` imports only node builtins and its own
# pure sibling, so the tag decision never waits on (or breaks because of) a dependency
# install.
#
# RELATIONSHIP TO deploy.yml — they do not fight:
#   * deploy.yml triggers on `push` to BRANCHES; a tag push is not a branch push, and refs
#     pushed with GITHUB_TOKEN do not trigger workflows anyway, so tagging cannot start a
#     second deploy.
#   * they write disjoint refs: deploy.yml writes `gh-pages`, this writes `refs/tags/*`.
#   * ORDERING CAVEAT, stated honestly: both run on the SAME push, so the artifact deploy.yml
#     publishes for that commit was built BEFORE this tag existed. Its `version.json` will
#     read `v3.0.0-84-gb0cf3cb` rather than the freshly-cut `v3.1.0`. That is accurate (the
#     build genuinely predates the tag) and the `sha` still identifies the commit exactly;
#     the next push to the branch reports the new tag. Coupling the two workflows to fix a
#     cosmetic lag is not worth the fragility.
name: release-tag

on:
  push:
    branches: [main, test]

permissions:
  contents: write # create and push the tag, and create the Release
  # READ for the ticket half of the bump (`#N` labels); WRITE for the release-checkpoint
  # comment on `verify-in-ci` issues (#55). The checkpoint step is `continue-on-error`, so
  # if this is ever tightened back to `read` a release still succeeds — it just goes quiet.
  issues: write

concurrency:
  # Two pushes racing would compute their bump from the same last tag and try to cut the
  # same version. Serialise per branch; never cancel a run that may already have tagged.
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # FULL history + tags REQUIRED: the bump is computed over `<last tag>..HEAD`, which
      # is meaningless in checkout's default shallow, tag-less clone (see deploy.yml).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute the release plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then channel=release; else channel=prerelease; fi
          echo "channel: ${channel}"

          # stdout is the JSON plan; stderr carries the MISMATCH / degraded-lookup /
          # manual-major warnings, which land in this step's log for a human to read.
          node tools/version.mjs --plan --channel "${channel}" > plan.json

          cat plan.json
          {
            echo "tag=$(jq -r '.tag // ""' plan.json)"
            # What this commit is RELEASED as — NOT the same as what to TAG (#55). A major
            # is tagged by hand (the major is the wire version and cannot be derived), so on
            # its promotion the computed range is empty and `.tag` is null, while
            # `.releaseTarget` names the tag a human already put on this commit.
            echo "release_tag=$(jq -r '.releaseTarget.tag // ""' plan.json)"
            echo "release_source=$(jq -r '.releaseTarget.source // ""' plan.json)"
            echo "bump=$(jq -r '.bump // "none"' plan.json)"
            echo "last_tag=$(jq -r '.lastTag // ""' plan.json)"
            echo "range=$(jq -r '.range' plan.json)"
            echo "channel=${channel}"
            echo "manual_major=$(jq -r '.manualMajor' plan.json)"
          } >> "$GITHUB_OUTPUT"

      # Every step below passes workflow values through `env:` rather than interpolating
      # `${{ }}` straight into the shell — a tag/range string is data, not script.
      - name: Announce a manual-major requirement
        if: steps.plan.outputs.manual_major == 'true'
        env:
          RANGE: ${{ steps.plan.outputs.range }}
        run: |
          echo "::warning::A commit in ${RANGE} carries a breaking marker."
          echo "::warning::The major version IS the wire-protocol version, so this means the NETWORK"
          echo "::warning::PROTOCOL broke — not the build, the config shape or an internal API."
          echo "::warning::This workflow NEVER cuts a major tag. If the break is real, tag \`dev\`:"
          echo "::warning::  git tag -a vX+1.0.0 -m 'why the wire changed' && git push origin vX+1.0.0"
          echo "::warning::Tag BEFORE pushing the branch, or the bump is computed from the previous"
          echo "::warning::tag and the wrong version is cut. The Release is then created for you."

      # Only a genuine no-op: nothing to CUT *and* nothing already sitting here to publish.
      # Before #55 this fired on the hand-tagged-major promotion too, and the release was
      # silently never created.
      - name: Skip — nothing in this range warrants a release
        if: steps.plan.outputs.tag == '' && steps.plan.outputs.release_tag == ''
        env:
          RANGE: ${{ steps.plan.outputs.range }}
          LAST_TAG: ${{ steps.plan.outputs.last_tag }}
        run: |
          echo "No feat/fix commit and no enhancement/bug ticket in ${RANGE},"
          echo "and no release tag points at this commit."
          echo "Leaving the version at ${LAST_TAG:-<untagged>} — no tag created."

      - name: Create and push the annotated tag
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          RANGE: ${{ steps.plan.outputs.range }}
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ANNOTATED (-a), not lightweight: it carries the tagger, date and this message,
          # and only annotated tags are what `git describe` prefers.
          {
            printf '%s (%s bump from %s)\n\n' "${TAG}" "${BUMP}" "${RANGE}"
            git log --format='- %s' "${RANGE}"
          } > tag-message.txt
          git tag -a "${TAG}" -F tag-message.txt
          git push origin "refs/tags/${TAG}"
          echo "created and pushed annotated tag ${TAG}"

      # ANY VERSION THAT REACHES `main` GETS A RELEASE (#55) — whether this run cut the tag
      # or a human did. Keyed on `release_tag`, not `tag`, which is the whole fix: `tag` is
      # empty on a hand-tagged major's promotion, and this step used to be skipped with it.
      # Idempotent, so a re-run of a partially-failed job never duplicates a Release.
      - name: Create the GitHub Release (main only)
        id: release
        if: steps.plan.outputs.release_tag != '' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.release_tag }}
          SOURCE: ${{ steps.plan.outputs.release_source }}
          RANGE: ${{ steps.plan.outputs.range }}
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists — nothing to do."
            exit 0
          fi

          if [ "${SOURCE}" = "existing" ]; then
            # A human tagged this commit. The plan's range is empty BY DEFINITION here (the
            # tag is its own last-release), so derive one from the tag's ancestry instead —
            # and lead with the message they wrote, which is the considered part of a
            # deliberate major. An empty `prev` (a first-ever release) leaves `range` as the
            # bare tag, which `git log` reads as "everything up to it".
            prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            range="${prev:+${prev}..}${TAG}"
            {
              git tag -l --format='%(contents)' "${TAG}"
              printf '\n## Commits\n\n'
              git log --format='- %s (%h)' "${range}"
            } > release-notes.md
          else
            {
              printf 'A **%s** bump over `%s`.\n\n## Commits\n\n' "${BUMP}" "${RANGE}"
              git log --format='- %s (%h)' "${RANGE}"
            } > release-notes.md
          fi

          gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md
          echo "created GitHub Release ${TAG} (from a ${SOURCE} tag)"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # RELEASE CHECKPOINT — the breadcrumb that says "come look at this now".
      #
      # Some tickets can only be closed by WATCHING a release happen: #55 itself cannot be
      # verified until a hand-tagged major has actually travelled to `main` and cut its
      # Release, which is a thing that happens rarely and cannot be rehearsed locally (this
      # workflow only ever runs on `main`/`test`). Remembering to check by hand, months
      # apart, is exactly the kind of promise that gets dropped.
      #
      # So the event announces itself: any OPEN issue labelled `verify-in-ci` gets a comment
      # naming what just happened. Opt-in by label, so the noise is bounded by whoever
      # applies it, and self-retiring — remove the label (or close the issue) and it stops.
      #
      # `continue-on-error` IS THE POINT, not laziness: a breadcrumb must never break the
      # thing it observes. A missing `verify-in-ci` label, a token without issue-write, an
      # API blip — none of those should turn a successful release into a red run. The step
      # reports its own failure into the log and the release stands.
      - name: Notify issues waiting on a release checkpoint
        if: always() && (steps.plan.outputs.tag != '' || steps.plan.outputs.release_tag != '')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          REF: ${{ github.ref_name }}
          CUT_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          SOURCE: ${{ steps.plan.outputs.release_source }}
          RELEASED: ${{ steps.release.outputs.created }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          issues="$(gh issue list --label verify-in-ci --state open --json number --jq '.[].number')"
          if [ -z "${issues}" ]; then
            echo "no open issues carry \`verify-in-ci\` — nothing to announce."
            exit 0
          fi

          {
            printf '### Release checkpoint\n\n'
            printf '`release-tag` ran on `%s` (channel `%s`).\n\n' "${REF}" "${CHANNEL}"
            printf '| fact | value |\n|---|---|\n'
            printf '| tag cut by CI | %s |\n' "${CUT_TAG:-none — nothing in the range warranted one}"
            printf '| released as | %s |\n' "${RELEASE_TAG:-none}"
            printf '| tag origin | %s |\n' "${SOURCE:-n/a}"
            printf '| GitHub Release created | %s |\n' "${RELEASED:-no}"
            printf '| run | %s |\n\n' "${RUN_URL}"
            printf 'A tag origin of **existing** means a human tagged the commit and CI only '
            printf 'published it — the path that silently produced no Release before #55.\n\n'
            printf 'You are seeing this because this issue is labelled `verify-in-ci`. '
            printf 'If this is the event you were waiting on, verify it and close; otherwise '
            printf 'leave the label and the next release will report again.\n'
          } > checkpoint.md

          for n in ${issues}; do
            if gh issue comment "${n}" --body-file checkpoint.md; then
              echo "announced on #${n}"
            else
              echo "::warning::could not comment on #${n} — the release itself is unaffected."
            fi
          done
