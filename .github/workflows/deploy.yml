# Any-branch GitHub Pages deploy (issue #22, generalized in v3.1).
#
# Builds the pushed branch and publishes it to `gh-pages` at a per-branch subpath, so
# EVERY branch is playable online without the environments clobbering each other:
#   main            → root       (base /pente3D.ai/)
#   <any other ref> → /<ref>/    (base /pente3D.ai/<ref>/ — e.g. /dev/, /test/, /feat/net-model-v3.1/)
#
# So `refs/heads/feat/foo` is playable at ggcdevs.github.io/pente3D.ai/feat/foo/ . Branch names
# with slashes become nested gh-pages dirs, which is fine. `keep_files: true` + a per-branch
# `destination_dir` mean deploying one branch never deletes another branch's subtree.
#
# Cleanup of a DELETED branch's subpath happens IN THIS FILE, opportunistically on every push (see
# the prune step below). It is not an `on: delete` workflow: GitHub only fires those from the DEFAULT
# branch, and that would mean plumbing on `main`. (This comment used to point at a
# `cleanup-branch-pages.yml` that does not exist.)
#
# The relay endpoint/creds are NOT in the repo (portability). They live in the `RELAY_CONFIG`
# repo variable and are written into src/config/defaults/relay.json before the build.
name: deploy

on:
  push:
    branches: ['**']
  # MANUAL RE-DEPLOY (#55). A build stamps `version.json` and `__APP_VERSION__` from
  # `git describe` AT BUILD TIME, so tagging a commit that has already been pushed leaves
  # its deployed artifact reporting the pre-tag describe (`v3.0.0-140-g<sha>`) with no way
  # to refresh it — the push that would rebuild it already happened. That is exactly the
  # shape of the hand-tagged major, which is the one release whose version people will
  # check. Dispatch this workflow on the branch to rebuild it in place.
  workflow_dispatch:

permissions:
  contents: write

# SERIALIZE every deploy, because they all publish by PUSHING to the one `gh-pages` branch. Two
# branches pushed close together (a feature branch and `dev`, seconds apart) raced: both built fine,
# both tried to push, and the loser was rejected non-fast-forward. The failure is QUIET in the worst
# way — the site keeps serving the previous build, so the URL still loads and only `version.json`
# reveals that the deploy never landed. Observed 2026-07-27: `/dev/` served the pre-v3.1 build for
# an hour after the promotion, and `version.json` 404'd because that older build predates it.
#
# `cancel-in-progress: false` is deliberate: each run publishes a DIFFERENT subpath, so a later push
# must WAIT for the earlier one rather than cancel it — cancelling would drop that branch's deploy
# entirely and reintroduce the same silent staleness from the other direction.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # FULL history + tags are REQUIRED, not a nicety (issue #22 versioning).
      # actions/checkout@v4 defaults to `fetch-depth: 1` AND `fetch-tags: false`, so the
      # default checkout contains ZERO tags. `git describe --tags` then fails outright and
      # `tools/version.mjs` degrades to `0.0.0-unknown` — every deployed build would report
      # an unknown version and `dist/version.json` would be useless as a deploy fingerprint.
      # `fetch-depth: 0` fetches all history and all tags; `fetch-tags: true` is redundant
      # with it but stated explicitly so a future depth change cannot silently drop tags.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Derive the per-branch base + gh-pages destination from the branch name.
      #   main → base /pente3D.ai/ , dest '' (root)
      #   else → base /pente3D.ai/<ref>/ , dest '<ref>'  (dev, test, feat/foo, …)
      - name: Resolve per-branch base and destination
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "base=/pente3D.ai/" >> "$GITHUB_OUTPUT"
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/pente3D.ai/${GITHUB_REF_NAME}/" >> "$GITHUB_OUTPUT"
            echo "dest=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Inject the real relay from the RELAY_CONFIG repo variable (the repo ships blank).
      - name: Write relay config from RELAY_CONFIG
        env:
          RELAY_CONFIG: ${{ vars.RELAY_CONFIG }}
        run: |
          if [ -z "${RELAY_CONFIG}" ]; then
            echo "RELAY_CONFIG repo variable is empty — refusing to deploy without a relay." >&2
            exit 1
          fi
          printf '%s' "${RELAY_CONFIG}" > src/config/defaults/relay.json
          echo "Wrote relay.json (host only, no creds printed):"
          node -e "const r=require('./src/config/defaults/relay.json'); console.log('wssUrl set:', Boolean(r.wssUrl), 'topicRoot:', r.topicRoot)"

      - name: Build
        env:
          DEPLOY_BASE: ${{ steps.env.outputs.base }}
        run: npm run build

      # Echo the fingerprint the build actually produced (issue #22). If the checkout ever
      # loses its tags again, this prints `0.0.0-unknown` and the regression is visible in
      # the deploy log instead of silently shipping.
      - name: Show the built version fingerprint
        run: cat dist/version.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ steps.env.outputs.dest }}
          keep_files: true

      # LAZY PRUNE of subpaths whose branch no longer exists.
      #
      # GitHub only fires `on: delete` workflows from the DEFAULT branch, and we don't want to
      # add plumbing to `main`, so cleanup runs opportunistically on EVERY push instead: delete
      # a branch, and its subpath disappears on the next push to any branch.
      #
      # SAFETY — the prune is driven by an explicit manifest (`.deployed-branches`) on gh-pages,
      # never by scanning directories. Only paths this workflow itself recorded can ever be
      # removed, so `main`'s root build (index.html, assets/, …) and any hand-placed file are
      # unreachable by construction. Branches absent from the manifest (e.g. deployed before it
      # existed) are simply never pruned — fail-safe, not fail-destructive.
      - name: Prune subpaths of deleted branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          if ! git clone --quiet --depth 1 --branch gh-pages "$REMOTE" "$work/ghp" 2>/dev/null; then
            echo "gh-pages not present yet — nothing to prune."; exit 0
          fi
          cd "$work/ghp"
          manifest=.deployed-branches
          touch "$manifest"

          # Record this deploy. `main` publishes to the ROOT and is never tracked or pruned.
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            grep -qxF "${GITHUB_REF_NAME}" "$manifest" || echo "${GITHUB_REF_NAME}" >> "$manifest"
          fi

          # Branches that still exist on the remote.
          git ls-remote --heads "$REMOTE" | sed 's#.*refs/heads/##' | sort -u > "$work/live"

          : > "$work/keep"
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if grep -qxF "$branch" "$work/live"; then
              echo "$branch" >> "$work/keep"
            else
              echo "pruning stale subpath for deleted branch: $branch"
              [ -d "$branch" ] && git rm -r --quiet -- "$branch"
            fi
          done < "$manifest"
          sort -u "$work/keep" -o "$manifest"

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --quiet -m "chore(pages): sync subpaths for live branches [skip ci]"
            git push --quiet origin gh-pages
            echo "gh-pages pruned/synced."
          else
            echo "gh-pages already in sync — nothing to do."
          fi
