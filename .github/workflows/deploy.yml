# Any-branch GitHub Pages deploy (issue #22, generalized in v3.1).
#
# Builds the pushed branch and publishes it to `gh-pages` at a per-branch subpath, so
# EVERY branch is playable online without the environments clobbering each other:
#   main            → root       (base /pente3D.ai/)
#   <any other ref> → /<ref>/    (base /pente3D.ai/<ref>/ — e.g. /dev/, /test/, /feat/net-model-v3.1/)
#
# So `refs/heads/feat/foo` is playable at ggcdevs.github.io/pente3D.ai/feat/foo/ . Branch names
# with slashes become nested gh-pages dirs, which is fine. `keep_files: true` + a per-branch
# `destination_dir` mean deploying one branch never deletes another branch's subtree.
#
# Cleanup of a DELETED branch's subpath is handled separately (see cleanup-branch-pages.yml —
# an `on: delete` workflow, which GitHub only fires from the DEFAULT branch).
#
# The relay endpoint/creds are NOT in the repo (portability). They live in the `RELAY_CONFIG`
# repo variable and are written into src/config/defaults/relay.json before the build.
name: deploy

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Derive the per-branch base + gh-pages destination from the branch name.
      #   main → base /pente3D.ai/ , dest '' (root)
      #   else → base /pente3D.ai/<ref>/ , dest '<ref>'  (dev, test, feat/foo, …)
      - name: Resolve per-branch base and destination
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "base=/pente3D.ai/" >> "$GITHUB_OUTPUT"
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/pente3D.ai/${GITHUB_REF_NAME}/" >> "$GITHUB_OUTPUT"
            echo "dest=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Inject the real relay from the RELAY_CONFIG repo variable (the repo ships blank).
      - name: Write relay config from RELAY_CONFIG
        env:
          RELAY_CONFIG: ${{ vars.RELAY_CONFIG }}
        run: |
          if [ -z "${RELAY_CONFIG}" ]; then
            echo "RELAY_CONFIG repo variable is empty — refusing to deploy without a relay." >&2
            exit 1
          fi
          printf '%s' "${RELAY_CONFIG}" > src/config/defaults/relay.json
          echo "Wrote relay.json (host only, no creds printed):"
          node -e "const r=require('./src/config/defaults/relay.json'); console.log('wssUrl set:', Boolean(r.wssUrl), 'topicRoot:', r.topicRoot)"

      - name: Build
        env:
          DEPLOY_BASE: ${{ steps.env.outputs.base }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ steps.env.outputs.dest }}
          keep_files: true
